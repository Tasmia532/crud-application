<div class="card">
  <h2>Update Post</h2>

  <a routerLink="/posts" class="btn btn-link">Back</a>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-group">
      <label>Title</label>
      <input formControlName="title" type="text" class="form-control">
      <span *ngIf="f['title'].touched && f['title'].invalid" class="error">
        Title is required.
      </span>
    </div>

    <div class="form-group">
      <label>Body</label>
      <textarea formControlName="body" class="form-control" rows="4"></textarea>
      <span *ngIf="f['body'].touched && f['body'].invalid" class="error">
        Body is required.
      </span>
    </div>

    <button class="btn btn-primary" type="submit" [disabled]="form.invalid">Update</button>
  </form>
</div>
