<div class="container">
  <h1>All Posts</h1>

  <a routerLink="/post/create" class="btn btn-success create-btn">Create New Post</a>
  
  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Body</th>
        <th width="250px">Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let post of posts$ | async">
  <td>{{ post.id }}</td>
  <td>{{ post.title }}</td>
  <td>{{ post.body }}</td>
  <td>
    <a [routerLink]="['/posts', post.id, 'edit']" class="btn btn-primary">Edit</a>
    <button (click)="deletePost(post.id)" class="btn btn-danger">Delete</button>
  </td>
</tr>

    </tbody>
  </table>
</div>
